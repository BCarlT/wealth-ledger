// ----- live price / FX engine (standalone hosting only) -----
async function jget(url){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),9000);
  try{ const r=await fetch(url,{signal:c.signal,cache:"no-store"}); if(!r.ok) throw new Error("http"+r.status); return await r.json(); }
  finally{ clearTimeout(t); } }
async function fetchFX(){
  // near-real-time from Yahoo FX (same market data Google shows); daily feed fills any gaps
  let ok=false;
  for(const p of [["IDR","USDIDR=X"],["TWD","USDTWD=X"],["SGD","USDSGD=X"]]){
    try{ const v=await yahooPrice(p[1]); if(v){ state.rates[p[0]]=v; ok=true; } }catch(e){} }
  if(ok) return true;
  try{ const j=await jget("https://open.er-api.com/v6/latest/USD");
    if(j&&j.rates){ ["TWD","IDR","SGD"].forEach(c=>{ if(j.rates[c]) state.rates[c]=j.rates[c]; }); return true; } }catch(e){}
  return false; }
// resolve ANY crypto ticker -> CoinGecko id (static map first, then live search); also grab logo
async function resolveCG(ticker){ const t=(ticker||"").toUpperCase(); if(!t) return null;
  if(CG_CACHE[t]!==undefined) return CG_CACHE[t];
  let id=CG[t]||null;
  try{ const j=await jget("https://api.coingecko.com/api/v3/search?query="+encodeURIComponent(t));
    const coins=(j&&j.coins)||[]; if(coins.length){ const exact=coins.find(c=>(c.symbol||"").toUpperCase()===t)||(id?coins.find(c=>c.id===id):null)||coins[0];
      if(!id) id=exact.id; if(exact&&(exact.large||exact.thumb)) CG_IMG[t]=exact.large||exact.thumb; }
  }catch(e){}
  CG_CACHE[t]=id; return id; }
async function fetchCrypto(){
  const cryptos=state.holdings.filter(h=>h.class==="crypto"&&h.ticker); if(!cryptos.length) return false;
  const map={}; for(const h of cryptos){ const t=h.ticker.toUpperCase(); if(map[t]===undefined) map[t]=await resolveCG(t); }
  const ids=[...new Set(Object.values(map).filter(Boolean))]; if(!ids.length) return false;
  const j=await jget("https://api.coingecko.com/api/v3/simple/price?ids="+ids.join(",")+"&vs_currencies=usd,idr,twd,sgd");
  let any=false; state.holdings.forEach(h=>{ if(h.class==="crypto"&&h.ticker){ const id=map[h.ticker.toUpperCase()]; const d=id&&j[id];
    if(d){ const cc=(h.ccy||"USD").toLowerCase(); const px=d[cc]!=null?d[cc]:d.usd; if(px!=null){ h.price=px; h.live=true; any=true; } }
    const img=CG_IMG[h.ticker.toUpperCase()]; if(img) h.logo=img; } });
  return any; }
// Map a stock holding to its Yahoo Finance symbol by currency/exchange
function yahooSymbol(h){ const t=(h.ticker||"").toUpperCase().replace(/\s+/g,""); if(!t) return null;
  if(h.ccy==="IDR") return t.replace(/\.JK$/,"")+".JK";           // Indonesia (IDX)
  if(h.ccy==="TWD") return t.replace(/\.TWO?$/,"")+".TW";         // Taiwan (TWSE)
  return t.replace(/\.US$/,""); }                                  // US / default
// Relay chain — Yahoo blocks direct browser calls, so try direct then public CORS relays
const YF_RELAYS=[
  u=>"https://proxy.cors.sh/"+u,
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u),
  u=>u ];
async function yahooPrice(sym){
  const y="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(sym)+"?interval=1d&range=1d";
  for(const relay of YF_RELAYS){ try{ const j=await jget(relay(y));
    const meta=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;
    if(meta&&typeof meta.regularMarketPrice==="number"&&meta.regularMarketPrice>0) return meta.regularMarketPrice;
  }catch(e){} }
  return null; }
async function fetchStocks(){
  const stocks=state.holdings.filter(h=>h.class==="stock"&&h.ticker); if(!stocks.length) return false;
  const key=(state.stockKey||"").trim(); let any=false; const done={};
  for(const h of stocks){ const sym=yahooSymbol(h); if(!sym) continue; const k=sym;
    if(done[k]!==undefined){ if(done[k]!=null){ h.price=done[k]; h.live=true; any=true; } continue; }
    let px=null;
    if(key && h.ccy==="USD"){ try{ const j=await jget("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(h.ticker.toUpperCase())+"&token="+encodeURIComponent(key)); if(j&&typeof j.c==="number"&&j.c>0) px=j.c; }catch(e){} }
    if(px==null) px=await yahooPrice(sym);
    done[k]=px;
    if(px!=null){ state.holdings.forEach(x=>{ if(x.class==="stock"&&yahooSymbol(x)===sym){ x.price=px; x.live=true; } }); any=true; }
  }
  return any; }
const GOLD_API="https://logam-mulia-api.iamutaki.workers.dev/api/prices/";
// galeri24 covers most brands; map our brand label -> its materialType strings (1g buyback)
const GOLD_MATCH={ "Galeri24":["GALERI 24"], "UBS":["UBS"], "Lotus Archi":["LOTUS ARCHI"], "Antam":["ANTAM NON PEGADAIAN","ANTAM"] };
async function goldBrandBuyback(){ const out={}; let all=[];
  try{ const j=await jget(GOLD_API+"galeri24"); const arr=(j&&(j.data||j.prices))||(Array.isArray(j)?j:[]); const byType={};
    arr.forEach(x=>{ if(Number(x.weight)===1){ const t=(x.materialType||x.material||"").toUpperCase().trim(); const bb=Number(x.buybackPrice)||0; if(bb>0&&byType[t]==null) byType[t]=bb; } });
    for(const brand in GOLD_MATCH){ for(const key of GOLD_MATCH[brand]){ if(byType[key]){ out[brand]=byType[key]; break; } } }
    all=Object.values(byType).filter(v=>v>0);
  }catch(e){}
  return {byBrand:out, avg: all.length?all.reduce((a,b)=>a+b,0)/all.length:0}; }
async function goldSpotIDR(){ // fallbacks: other dealer feeds, then international spot
  for(const src of ["anekalogam","treasury"]){ try{ const j=await jget(GOLD_API+src);
    const arr=(j&&(j.data||j.prices))||(Array.isArray(j)?j:[]); const one=arr.find(x=>Number(x.weight)===1)||arr[0];
    if(one){ const p=Number(one.buybackPrice||one.sellPrice||one.price); if(p>0) return p; } }catch(e){} }
  try{ const g=await jget("https://api.gold-api.com/price/XAU"); if(g&&g.price) return (g.price/GRAMS_PER_OZT)*rate("IDR"); }catch(e){}
  try{ const spot=await yahooPrice("GC=F"); if(spot) return (spot/GRAMS_PER_OZT)*rate("IDR"); }catch(e){}
  return null; }
async function fetchGold(){
  const golds=state.holdings.filter(h=>h.class==="gold"); if(!golds.length) return false;
  const g=await goldBrandBuyback(); let general=g.avg; if(!general) general=await goldSpotIDR(); if(!general) return false;
  let any=false;
  state.holdings.forEach(h=>{ if(h.class==="gold" && !h.manual){ const perGramIDR = g.byBrand[h.brand] || general;
    const cc=h.ccy||"IDR"; h.price = cc==="IDR" ? perGramIDR : (perGramIDR/rate("IDR"))*rate(cc); h.live=true; any=true; } });
  return any; }
async function refreshLive(){
  if(inArtifact()) return;
  liveStatus="busy"; updatePill();
  let ok=false;
  const res=await Promise.allSettled([fetchFX(),fetchCrypto(),fetchStocks(),fetchGold()]);
  ok=res.some(r=>r.status==="fulfilled"&&r.value===true);
  if(ok){ state.liveAt=Date.now(); state.pricesUpdatedAt=new Date().toISOString(); state.ratesUpdatedAt=new Date().toISOString().slice(0,10); saveLocal(); liveStatus="on"; render(); }
  else { liveStatus="err"; updatePill(); }
}

// ----- mutations -----
function positionKey(h){ return h.class+"|"+((h.ticker||h.brand||"").toUpperCase())+"|"+(h.ccy||"")+"|"+((h.platform||"").toLowerCase())+"|"+(h.lot||1); }
function addHolding(h){
  // buying more of a position you already hold: sum the quantity, blend the average cost
  if((h.class==="stock"||h.class==="crypto"||h.class==="gold")&&(h.ticker||h.brand)){
    const ex=state.holdings.find(x=>positionKey(x)===positionKey(h));
    if(ex){ const addQty=h.qty||0;
      if(h.class==="gold"){ ex.qty=(ex.qty||0)+addQty; }
      else { const buyPrice=(h.avg||h.price||0); const oldQty=ex.qty||0; const newQty=oldQty+addQty;
        if((ex.avg||buyPrice)&&newQty) ex.avg=((oldQty*(ex.avg||0))+(addQty*buyPrice))/newQty; ex.qty=newQty; }
      if(classOf(h.class).unit) state.pricesUpdatedAt=new Date().toISOString();
      persist(); render(); if(!inArtifact()&&state.autoRefresh) refreshLive(); return true; }
  }
  state.holdings.push({id:uid(),...h}); if(classOf(h.class).unit) state.pricesUpdatedAt=new Date().toISOString(); persist(); render(); if(!inArtifact()&&state.autoRefresh) refreshLive(); return false; }
function sellHolding(id,qty){ const h=state.holdings.find(x=>x.id===id); if(!h)return; const n=Math.max(0,qty||0);
  const newQty=Math.max(0,(h.qty||0)-n); if(newQty<=0){ state.holdings=state.holdings.filter(x=>x.id!==id); } else { h.qty=newQty; }
  ui.modal=null; persist(); render(); }
function delHolding(id){ state.holdings=state.holdings.filter(x=>x.id!==id); persist(); render(); }
function delExpense(id){ state.expenses=state.expenses.filter(x=>x.id!==id); persist(); render(); }
function addExpense(e){ state.expenses.push({id:uid(),...e}); persist(); render(); }
function addIncome(e){ state.income.push({id:uid(),...e}); persist(); render(); }
function delIncome(id){ state.income=state.income.filter(x=>x.id!==id); persist(); render(); }
function saveSnapshot(){ const today=new Date().toISOString().slice(0,10); const usd=netWorthUSD();
  const ex=state.snapshots.find(s=>s.date===today); if(ex)ex.usd=usd; else state.snapshots.push({date:today,usd});
  state.snapshots.sort((a,b)=>a.date<b.date?-1:1); persist(); render(); }

// ----- charts -----
function setupCanvas(cv,w,h){ const dpr=window.devicePixelRatio||1; cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px"; const x=cv.getContext("2d"); x.scale(dpr,dpr); return x; }
function drawDonut(cv,data){ const size=cv.clientWidth||132, ctx=setupCanvas(cv,size,size);
  const cx=size/2,cy=size/2,r=size/2-6,ir=r*0.62,total=data.reduce((a,d)=>a+d.v,0);
  ctx.clearRect(0,0,size,size);
  if(total<=0){ ctx.strokeStyle=cvar("--border"); ctx.lineWidth=r-ir; ctx.beginPath(); ctx.arc(cx,cy,(r+ir)/2,0,Math.PI*2); ctx.stroke(); return; }
  let a=-Math.PI/2; data.forEach(d=>{ if(d.v<=0)return; const ang=d.v/total*Math.PI*2;
    ctx.beginPath(); ctx.arc(cx,cy,r,a,a+ang); ctx.arc(cx,cy,ir,a+ang,a,true); ctx.closePath(); ctx.fillStyle=d.c; ctx.fill(); a+=ang; }); }
function drawSpark(cv,pts){ const w=cv.clientWidth||400,h=56,ctx=setupCanvas(cv,w,h); ctx.clearRect(0,0,w,h); if(pts.length<2)return;
  const ys=pts.map(p=>p.usd), mn=Math.min(...ys), mx=Math.max(...ys), pad=6;
  const X=i=>pad+i/(pts.length-1)*(w-pad*2), Y=v=> mx===mn?h/2:h-pad-((v-mn)/(mx-mn))*(h-pad*2);
  const up=ys[ys.length-1]>=ys[0], col=up?cvar("--gain"):cvar("--loss");
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(i),Y(p.usd)):ctx.moveTo(X(i),Y(p.usd)));
  const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,col+"33"); g.addColorStop(1,col+"00");
  ctx.lineTo(X(pts.length-1),h); ctx.lineTo(X(0),h); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(i),Y(p.usd)):ctx.moveTo(X(i),Y(p.usd)));
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  const lx=X(pts.length-1),ly=Y(ys[ys.length-1]);
  ctx.beginPath(); ctx.arc(lx,ly,3.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
  ctx.beginPath(); ctx.arc(lx,ly,3.5,0,Math.PI*2); ctx.strokeStyle=cvar("--surface"); ctx.lineWidth=2; ctx.stroke(); }
function snapSeries(){ const s=state.snapshots.slice(); const t=new Date().toISOString().slice(0,10); if(!s.find(x=>x.date===t)) s.push({date:t,usd:netWorthUSD()}); return s; }
function paintCharts(){ const dn=$("#donut"); if(dn){ const t=classUSD(); drawDonut(dn,CLASSES.map(c=>({v:t[c.k],c:cvar(c.v)}))); } const sp=$("#spark"); if(sp) drawSpark(sp,snapSeries()); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }

  html+="</div></div>";
  if(!readOnly) html+="<div class=\"section-t\"><h2>Add a holding</h2></div>"+addHoldingCard();

}

function viewCashflow(){
  const m=ui.expMonth;
  const exps=monthOf(state.expenses,m).slice(), incs=monthOf(state.income,m).slice();
  const incUSD=sumUSD(incs), expUSD=sumUSD(exps), savedUSD=incUSD-expUSD, sRate=incUSD>0?savedUSD/incUSD*100:null;
  const byCat={}; exps.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+toUSD(e.amount,e.ccy));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]), maxCat=cats.length?cats[0][1]:1;
  const bySrc={}; exps.forEach(e=>{ const a=e.account||"Cash / Wallet"; bySrc[a]=(bySrc[a]||0)+toUSD(e.amount,e.ccy); });
  const srcs=Object.entries(bySrc).sort((a,b)=>b[1]-a[1]), maxSrc=srcs.length?srcs[0][1]:1, ccUSD=bySrc["Credit Card"]||0;

  let html="<div class=\"section-t\"><h2>Cash flow</h2><select class=\"inp\" id=\"monthSel\" style=\"width:auto\">"+months.map(mo=>"<option value=\""+mo+"\" "+(mo===m?"selected":"")+">"+monthLabel(mo)+"</option>").join("")+"</select></div>";
  html+="<div class=\"grid cf-grid\" style=\"grid-template-columns:1fr 1fr;align-items:start\">";
  html+="<div><div class=\"card pad\"><div class=\"eyebrow\">Savings rate · "+esc(monthLabel(m))+"</div>"
    +"<div class=\"networth num\" style=\"font-size:44px;margin:8px 0 2px;color:"+(sRate==null?"var(--ink)":sRate>=0?"var(--gain)":"var(--loss)")+"\">"+(sRate==null?"—":sRate.toFixed(0)+"%")+"</div>"
    +"<div style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">"+(sRate==null?"Log income to calculate":"You saved "+fmtD(savedUSD)+" of "+fmtD(incUSD)+" earned")+"</div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center\">"
      +cfstat("Income",fmtD(incUSD),"var(--gain)")+cfstat("Spending",fmtD(expUSD),"var(--loss)")+cfstat("Net saved",fmtD(savedUSD),savedUSD>=0?"var(--gain)":"var(--loss)")
    +"</div>"
    +(ccUSD>0?"<div style=\"margin-top:14px;padding:10px 13px;background:var(--loss-soft);border:1px solid color-mix(in srgb,var(--loss) 25%,transparent);border-radius:10px;display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:13px\">💳 On credit card <span style=\"color:var(--faint)\">· you’ll owe this</span></span><span class=\"num\" style=\"font-weight:700;color:var(--loss)\">"+fmtD(ccUSD)+"</span></div>":"")
    +"</div>";
  html+="<div class=\"card pad\" style=\"margin-top:16px\"><div class=\"eyebrow\" style=\"margin-bottom:14px\">Spending by category</div>"
    +(cats.length?"<div class=\"catbars\">"+cats.map(c=>{ const meta=CATS.find(x=>x[0]===c[0]);
        return "<div class=\"catbar\"><div class=\"top\"><span>"+(meta?meta[1]+" ":"")+esc(c[0])+"</span><span class=\"num\">"+fmtD(c[1])+"</span></div><div class=\"track\"><div class=\"fill\" style=\"width:"+(c[1]/maxCat*100)+"%;background:var(--gold)\"></div></div></div>"; }).join("")+"</div>":"<div style=\"color:var(--muted);font-size:14px\">No spending logged this month.</div>")
    +"</div>";
  html+="<div class=\"card pad\" style=\"margin-top:16px\"><div class=\"eyebrow\" style=\"margin-bottom:14px\">Spending by source</div>"
    +(srcs.length?"<div class=\"catbars\">"+srcs.map(sv=>{ const isCC=/credit|card/i.test(sv[0]);

  html+="</div></div>";

  return "<div class=\"card pad\" style=\"margin-top:16px\"><form id=\"expForm\"><div class=\"eyebrow\" style=\"margin-bottom:12px;color:var(--loss)\">－ Log expense</div>"
    +"<div style=\"display:grid;grid-template-columns:1fr .8fr 1fr;gap:10px\">"+fieldNum("Amount","eAmt","0")+"<div class=\"field\"><label>Ccy</label>"+ccySelect("eCcy","TWD")+"</div><div class=\"field\"><label>Date</label><input class=\"inp num\" id=\"eDate\" type=\"date\" value=\""+today+"\"></div></div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-top:10px\"><div class=\"field\"><label>Category</label><select class=\"inp\" id=\"eCat\">"+CATS.map(c=>"<option value=\""+c[0]+"\">"+c[1]+" "+c[0]+"</option>").join("")+"</select></div><div class=\"field\"><label>Paid from</label>"+acctSelect("eAcct","Cash / Wallet")+"</div><div class=\"field\"><label>Note</label><input class=\"inp\" id=\"eNote\" placeholder=\"e.g. PX Mart\"></div></div>"
    +"<div style=\"margin-top:14px\"><button class=\"btn gold\" type=\"submit\">Add expense</button></div></form></div>";
}

function tradeUnit(h){ return h.class==="gold"?"grams":h.class==="crypto"?"units":(h.lot===100?"lots":"shares"); }
function sellModalHTML(id){ const h=state.holdings.find(x=>x.id===id); if(!h) return "";
  const u=tradeUnit(h), isG=h.class==="gold"; const buyLbl=isG?"Price / gram":"Buy price ("+CCY[h.ccy||"IDR"].sym.trim()+(h.class==="stock"?" per share":"")+")";
  return "<div class=\"scrim\" id=\"scrim\"><div class=\"modal\" style=\"max-width:400px\"><h3>"+esc(h.name||h.ticker||h.brand)+"</h3>"
    +"<div class=\"sub\">You hold <b>"+fmtNum(h.qty,8)+" "+u+"</b>"+(h.avg?" · avg "+fmt(h.avg,h.ccy):"")+". Record a buy (adds &amp; re-averages) or a sell (reduces).</div>"
    +"<div class=\"seg\" id=\"tradeSide\" style=\"margin-bottom:14px\"><button type=\"button\" data-side=\"buy\" class=\"on\">Buy more</button><button type=\"button\" data-side=\"sell\">Sell</button></div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">"
    +"<div class=\"field\"><label>Quantity ("+u+")</label><input class=\"inp num\" id=\"tQty\" type=\"number\" step=\"any\" placeholder=\"0\"></div>"
    +(isG?"":"<div class=\"field\" id=\"tPriceWrap\"><label>"+buyLbl+"</label><input class=\"inp num\" id=\"tPrice\" type=\"number\" step=\"any\" placeholder=\""+(h.avg||h.price||0)+"\"></div>")
    +"</div>"
    +"<div class=\"modal-actions\"><button class=\"btn ghost\" id=\"tCancel\">Cancel</button><button class=\"btn gold\" id=\"tGo\">Confirm buy</button></div></div></div>"; }
function modalHTML(){
  if(ui.modal&&ui.modal.indexOf&&ui.modal.indexOf("sell:")===0) return sellModalHTML(ui.modal.slice(5));
  const r=state.rates, sa=!inArtifact();
  const envNote = sa
    ? "You’re running this <b>self-hosted</b> — live auto-refresh is available below."
    : "You’re running inside <b>Claude</b>, whose sandbox blocks live fetching. Export your data below and host the file on your own site for automatic prices.";
  let live="";
  if(sa){ live="<div class=\"mrow\"><span class=\"mlab\">Auto-refresh live prices</span><label class=\"switch\"><input type=\"checkbox\" id=\"mAuto\" "+(state.autoRefresh?"checked":"")+"><span class=\"slider\"></span></label></div>"
    +"<div class=\"mrow\" style=\"margin-top:12px\"><span class=\"mlab\">Refresh every</span><select class=\"inp\" id=\"mMins\" style=\"width:auto\">"+[2,5,15,30,60].map(n=>"<option value=\""+n+"\" "+(state.refreshMins==n?"selected":"")+">"+n+" min</option>").join("")+"</select></div>"
    +"<div class=\"field\" style=\"margin-top:14px\"><label>US stock API key (optional booster)</label><input class=\"inp\" id=\"mKey\" value=\""+esc(state.stockKey)+"\" placeholder=\"paste a free Finnhub token\"></div>"
    +"<div style=\"font-size:11.5px;color:var(--faint);margin-top:6px\">Stocks (US, Indonesia, Taiwan), crypto &amp; FX all auto-price with no key. A free finnhub.io token just makes US quotes faster/steadier. Stored only in this browser.</div>"
    +"<div style=\"margin-top:14px\"><button class=\"btn gold sm\" id=\"mRefresh\">↻ Refresh prices now</button></div><div class=\"mdiv\"></div>"; }
  return "<div class=\"scrim\" id=\"scrim\"><div class=\"modal\"><h3>Settings &amp; live data</h3><div class=\"sub\">"+envNote+"</div>"
    +live
    +"<span class=\"mlab\">Exchange rates"+(state.ratesUpdatedAt?" · updated "+esc(state.ratesUpdatedAt):"")+"</span>"
    +"<div class=\"field\" style=\"margin-top:10px\"><label>TWD per 1 USD</label><input class=\"inp num\" id=\"rTWD\" type=\"number\" step=\"any\" value=\""+r.TWD+"\"></div>"
    +"<div class=\"field\" style=\"margin-top:10px\"><label>IDR per 1 USD</label><input class=\"inp num\" id=\"rIDR\" type=\"number\" step=\"any\" value=\""+r.IDR+"\"></div>"
    +"<div style=\"font-size:12px;color:var(--faint);margin-top:8px\">1 NT$ ≈ Rp "+(r.IDR/r.TWD).toLocaleString("en-US",{maximumFractionDigits:0})+"</div>"
    +(sa?"<div class=\"mdiv\"></div><span class=\"mlab\">Your data</span>"
      +"<div style=\"font-size:11.5px;color:var(--faint);margin:6px 0 10px\">Saved in this browser. Export a backup to keep it safe or move it to another device.</div>"
      +"<div style=\"display:flex;gap:10px\"><button class=\"btn ghost sm\" id=\"mExport\">⬇ Export backup</button><button class=\"btn ghost sm\" id=\"mImport\">⬆ Import</button><input type=\"file\" id=\"mFile\" accept=\"application/json\" style=\"display:none\"></div>":"")
    +"<div class=\"modal-actions\"><button class=\"btn ghost\" id=\"mCancel\">Close</button><button class=\"btn gold\" id=\"mSave\">Save</button></div></div></div>";
}
function exportData(){ try{ const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="wealth-ledger-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }catch(e){ alert("Export failed: "+e.message); } }
function importData(file){ const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result);
  if(!o||!o.holdings&&!o.expenses) throw new Error("not a backup file");
  state=Object.assign(state,o); state=loadStateFrom(state); ui.modal=null; persist(); render(); startLive(); }catch(e){ alert("Import failed: "+e.message); } }; rd.readAsText(file); }
function loadStateFrom(s){ s.holdings=(s.holdings||[]).map(h=>({...h,ccy:h.ccy||"TWD"})); s.expenses=(s.expenses||[]).map(e=>({...e,ccy:e.ccy||"TWD"})); s.income=(s.income||[]).map(e=>({...e,ccy:e.ccy||"TWD"})); s.rates=Object.assign({USD:1,TWD:31.8,IDR:17800},s.rates||{}); s.snapshots=s.snapshots||[]; return s; }

function monthLabel(m){ const [y,mo]=m.split("-"); return new Date(y,mo-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"}); }
function monthOptions(){ const set=new Set(state.expenses.concat(state.income).map(e=>(e.date||"").slice(0,7)).filter(Boolean)); set.add(curMonth()); set.add(ui.expMonth); return Array.from(set).sort().reverse(); }
function timeAgo(iso){ const d=(Date.now()-new Date(iso).getTime())/1000; if(d<90)return"just now"; if(d<3600)return Math.round(d/60)+"m ago"; if(d<86400)return Math.round(d/3600)+"h ago"; return Math.round(d/86400)+"d ago"; }

function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render();});
  document.querySelectorAll("[data-disp]").forEach(b=>b.onclick=()=>setDisplay(b.dataset.disp));
  const tb=$("#themeBtn"); if(tb)tb.onclick=toggleTheme;
  const sb=$("#setBtn"); if(sb)sb.onclick=()=>{ui.modal="set";render();};
  const lb=$("#liveBtn"); if(lb)lb.onclick=()=>refreshLive();
  const snap=$("#snapBtn"); if(snap)snap.onclick=saveSnapshot;
  const mo=$("#monthSel"); if(mo)mo.onchange=()=>{ui.expMonth=mo.value;render();};

  if(ui.modal&&ui.modal.indexOf("sell:")===0){ const id=ui.modal.slice(5); const sc=$("#scrim");
    sc.onclick=e=>{if(e.target===sc){ui.modal=null;render();}}; $("#tCancel").onclick=()=>{ui.modal=null;render();};
    let side="buy"; const go=$("#tGo"), pw=$("#tPriceWrap");
    document.querySelectorAll("#tradeSide button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("#tradeSide button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); side=b.dataset.side;
      go.textContent=side==="buy"?"Confirm buy":"Confirm sell"; if(pw) pw.style.display=side==="buy"?"":"none"; });
    go.onclick=()=>{ const h=state.holdings.find(x=>x.id===id); if(!h){ui.modal=null;render();return;} const q=parseNum($("#tQty").value);
      if(q<=0){ flash($("#tQty")); return; }
      if(side==="buy"){ const pr=h.class==="gold"?0:parseNum(($("#tPrice")||{}).value); ui.modal=null;
        addHolding({class:h.class,name:h.name,ticker:h.ticker,brand:h.brand,qty:q,price:h.class==="gold"?h.price:0,avg:h.class==="gold"?undefined:(pr||h.avg),ccy:h.ccy,platform:h.platform,lot:h.lot||1}); }
      else { sellHolding(id,q); } };
    return;
  }
  if(ui.modal){ const sc=$("#scrim"); sc.onclick=e=>{if(e.target===sc){ui.modal=null;render();}};
    $("#mCancel").onclick=()=>{ui.modal=null;render();};
    $("#mSave").onclick=()=>{ state.rates.TWD=parseFloat($("#rTWD").value)||state.rates.TWD; state.rates.IDR=parseFloat($("#rIDR").value)||state.rates.IDR;
      const au=$("#mAuto"), mm=$("#mMins"), mk=$("#mKey");
      if(au) state.autoRefresh=au.checked; if(mm) state.refreshMins=parseInt(mm.value)||5; if(mk) state.stockKey=mk.value.trim();
      state.ratesUpdatedAt=new Date().toISOString().slice(0,10); ui.modal=null; persist(); render(); startLive(); };
    const rf=$("#mRefresh"); if(rf)rf.onclick=()=>{ ui.modal=null; render(); refreshLive(); };
    const ex=$("#mExport"); if(ex)ex.onclick=exportData;
    const im=$("#mImport"), mf=$("#mFile"); if(im&&mf){ im.onclick=()=>mf.click(); mf.onchange=()=>{ if(mf.files[0]) importData(mf.files[0]); }; }
  }

  document.querySelectorAll(".price-edit").forEach(inp=>{ const commit=()=>{ const raw=inp.value.trim(); const v=raw===""?0:parseNum(raw); const h=state.holdings.find(x=>x.id===inp.dataset.id); if(!h)return; const f=inp.dataset.field||"price";
      if(h[f]!==v){ h[f]=v; if(f==="price"&&h.class==="gold") h.manual=true; if(f==="price"&&h.class!=="bond"&&h.class!=="gold"){ h.live=false; } if(f==="price"&&classOf(h.class).unit)state.pricesUpdatedAt=new Date().toISOString(); persist(); render(); } };
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();inp.blur();}}); inp.addEventListener("blur",commit); });
  document.querySelectorAll(".rowbtn.del").forEach(b=>b.onclick=()=>delHolding(b.dataset.id));
  document.querySelectorAll(".rowbtn.sell").forEach(b=>b.onclick=()=>{ ui.modal="sell:"+b.dataset.id; render(); });
  document.querySelectorAll(".del-exp").forEach(b=>b.onclick=()=>delExpense(b.dataset.id));
  document.querySelectorAll(".del-inc").forEach(b=>b.onclick=()=>delIncome(b.dataset.id));

  const hf=$("#holdForm");
  if(hf){ let cls="stock"; const box=$("#hFields"); box.innerHTML=holdFields(cls);
    document.querySelectorAll("#hClass button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("#hClass button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); cls=b.dataset.c; box.innerHTML=holdFields(cls); });
    hf.onsubmit=e=>{ e.preventDefault(); const c=classOf(cls); const name=(($("#hName")||{}).value||"").trim(); const ccy=($("#hCcy")||{}).value||"TWD"; const plat=(($("#hPlat")||{}).value||"").trim();
      if(cls==="gold"){ const brand=($("#hBrand")||{}).value||"Gold"; const grams=parseNum(($("#hQty")||{}).value);
        if(!grams){flash($("#hQty"));return;} addHolding({class:"gold",name:brand,brand:brand,ticker:"",qty:grams,lot:1,price:0,ccy:ccy,platform:plat}); }
      else if(c.unit){ const price=parseNum(($("#hPrice")||{}).value); const qty=parseNum(($("#hQty")||{}).value); const tk=(($("#hTicker")||{}).value||"").trim(); const av=parseNum(($("#hAvg")||{}).value); const lot=parseInt(($("#hUnit")||{}).value)||1;
        if(!name&&!tk){flash($("#hName"));return;} addHolding({class:cls,name:name||tk,ticker:tk.toUpperCase(),qty:qty,price:price,ccy:ccy,platform:plat,avg:av>0?av:undefined,lot:lot}); }
      else if(cls==="bond"){ const face=parseNum(($("#hFace")||{}).value); const cp=parseNum(($("#hPrice")||{}).value)||100; const coupon=parseNum(($("#hCoupon")||{}).value); const freq=parseInt(($("#hFreq")||{}).value)||2; const last=($("#hLast")||{}).value||"";
        if(!name){flash($("#hName"));return;} if(!face){flash($("#hFace"));return;} addHolding({class:"bond",name:name,ticker:"",ccy:ccy,platform:plat,face:face,price:cp,coupon:coupon>0?coupon:undefined,freq:freq,lastCoupon:last}); }
      else { const price=parseNum(($("#hPrice")||{}).value); if(!name){flash($("#hName"));return;} addHolding({class:cls,name:name,ticker:"",qty:1,price:price,ccy:ccy,platform:plat}); } };
  }
  const inf=$("#incForm");
  if(inf) inf.onsubmit=e=>{ e.preventDefault(); const a=parseFloat($("#iAmt").value)||0; if(a<=0){flash($("#iAmt"));return;} addIncome({amount:a,ccy:$("#iCcy").value,date:$("#iDate").value||new Date().toISOString().slice(0,10),source:$("#iSrc").value,account:($("#iAcct")||{}).value||"Cash / Wallet",note:$("#iNote").value.trim()}); };
  const ef=$("#expForm");
  if(ef) ef.onsubmit=e=>{ e.preventDefault(); const a=parseFloat($("#eAmt").value)||0; if(a<=0){flash($("#eAmt"));return;} addExpense({amount:a,ccy:$("#eCcy").value,date:$("#eDate").value||new Date().toISOString().slice(0,10),category:$("#eCat").value,account:($("#eAcct")||{}).value||"Cash / Wallet",note:$("#eNote").value.trim()}); };
}
function flash(el){ if(!el)return; el.style.borderColor="var(--loss)"; el.focus(); setTimeout(()=>el.style.borderColor="",800); }
function toggleTheme(){ const cur=document.documentElement.getAttribute("data-theme"); const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches); document.documentElement.setAttribute("data-theme",dark?"light":"dark"); requestAnimationFrame(paintCharts); }

try{ const u=JSON.parse(sessionStorage.getItem("wl-ui")); if(u){ ui.tab=u.tab||ui.tab; ui.expMonth=u.expMonth||ui.expMonth; sessionStorage.removeItem("wl-ui"); window.addEventListener("load",()=>setTimeout(()=>window.scrollTo(0,u.scroll||0),60)); } }catch(e){}
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(paintCharts,120);});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>requestAnimationFrame(paintCharts));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !inArtifact() && state.autoRefresh && Date.now()-(state.liveAt||0)>90000) refreshLive(); });

render(); setStatus("saved","Ready");
if(!started){ started=true; startLive(); }
})();
</script>
