// ----- live price / FX engine (standalone hosting only) -----
async function jget(url){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),9000);
  try{ const r=await fetch(url,{signal:c.signal,cache:"no-store"}); if(!r.ok) throw new Error("http"+r.status); return await r.json(); }
  finally{ clearTimeout(t); } }
async function fetchFX(){ const j=await jget("https://open.er-api.com/v6/latest/USD");
  if(j&&j.rates&&j.rates.TWD&&j.rates.IDR){ state.rates.TWD=j.rates.TWD; state.rates.IDR=j.rates.IDR; return true; } return false; }
async function fetchCrypto(){
  const ids=[...new Set(state.holdings.filter(h=>h.class==="crypto"&&CG[(h.ticker||"").toUpperCase()]).map(h=>CG[h.ticker.toUpperCase()]))];
  if(!ids.length) return false;
  const j=await jget("https://api.coingecko.com/api/v3/simple/price?ids="+ids.join(",")+"&vs_currencies=usd");
  let any=false; state.holdings.forEach(h=>{ if(h.class==="crypto"){ const id=CG[(h.ticker||"").toUpperCase()]; if(id&&j[id]&&j[id].usd!=null){ h.price=j[id].usd; h.ccy="USD"; h.live=true; any=true; } } });
  return any; }
async function fetchStocks(){
  const key=(state.stockKey||"").trim(); if(!key) return false;
  const syms=[...new Set(state.holdings.filter(h=>h.class==="stock"&&h.ticker&&h.ccy==="USD").map(h=>h.ticker.toUpperCase()))];
  if(!syms.length) return false; let any=false;
  for(const s of syms){ try{ const j=await jget("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(s)+"&token="+encodeURIComponent(key));
    if(j&&typeof j.c==="number"&&j.c>0){ state.holdings.forEach(h=>{ if(h.class==="stock"&&(h.ticker||"").toUpperCase()===s){ h.price=j.c; h.live=true; any=true; } }); } }catch(e){} }
  return any; }
async function refreshLive(){
  if(inArtifact()) return;
  liveStatus="busy"; updatePill();
  let ok=false;
  const res=await Promise.allSettled([fetchFX(),fetchCrypto(),fetchStocks()]);
  ok=res.some(r=>r.status==="fulfilled"&&r.value===true);
  if(ok){ state.liveAt=Date.now(); state.pricesUpdatedAt=new Date().toISOString(); state.ratesUpdatedAt=new Date().toISOString().slice(0,10); saveLocal(); liveStatus="on"; render(); }
  else { liveStatus="err"; updatePill(); }
}
function updatePill(){ const b=$("#liveBtn"); if(!b)return;
  b.className="livepill "+(liveStatus==="busy"?"busy":liveStatus==="err"?"err":state.liveAt?"on":"");
  const lt=b.querySelector(".lt"); if(lt) lt.textContent=pillText(); }
function pillText(){ if(liveStatus==="busy")return"Updating…"; if(liveStatus==="err")return"Retry";
  return state.liveAt? "Live · "+new Date(state.liveAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : "Go live"; }
function startLive(){ clearInterval(liveTimer); liveTimer=null; if(inArtifact()||!state.autoRefresh) return;
  refreshLive(); liveTimer=setInterval(()=>{ if(document.visibilityState==="visible") refreshLive(); }, Math.max(1,state.refreshMins||5)*60000); }

// ----- mutations -----
function addHolding(h){ state.holdings.push({id:uid(),...h}); if(classOf(h.class).unit) state.pricesUpdatedAt=new Date().toISOString(); persist(); render(); if(!inArtifact()&&state.autoRefresh) refreshLive(); }
function delHolding(id){ state.holdings=state.holdings.filter(x=>x.id!==id); persist(); render(); }
function delExpense(id){ state.expenses=state.expenses.filter(x=>x.id!==id); persist(); render(); }
function addExpense(e){ state.expenses.push({id:uid(),...e}); persist(); render(); }
function addIncome(e){ state.income.push({id:uid(),...e}); persist(); render(); }
function delIncome(id){ state.income=state.income.filter(x=>x.id!==id); persist(); render(); }
function saveSnapshot(){ const today=new Date().toISOString().slice(0,10); const usd=netWorthUSD();
  const ex=state.snapshots.find(s=>s.date===today); if(ex)ex.usd=usd; else state.snapshots.push({date:today,usd});
  state.snapshots.sort((a,b)=>a.date<b.date?-1:1); persist(); render(); }
function setDisplay(c){ if(state.display===c)return; state.display=c; persist(); render(); }

// ----- charts -----
function setupCanvas(cv,w,h){ const dpr=window.devicePixelRatio||1; cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px"; const x=cv.getContext("2d"); x.scale(dpr,dpr); return x; }
function drawDonut(cv,data){ const size=cv.clientWidth||132, ctx=setupCanvas(cv,size,size);
  const cx=size/2,cy=size/2,r=size/2-6,ir=r*0.62,total=data.reduce((a,d)=>a+d.v,0);
  ctx.clearRect(0,0,size,size);
  if(total<=0){ ctx.strokeStyle=cvar("--border"); ctx.lineWidth=r-ir; ctx.beginPath(); ctx.arc(cx,cy,(r+ir)/2,0,Math.PI*2); ctx.stroke(); return; }
  let a=-Math.PI/2; data.forEach(d=>{ if(d.v<=0)return; const ang=d.v/total*Math.PI*2;
    ctx.beginPath(); ctx.arc(cx,cy,r,a,a+ang); ctx.arc(cx,cy,ir,a+ang,a,true); ctx.closePath(); ctx.fillStyle=d.c; ctx.fill(); a+=ang; }); }
function drawSpark(cv,pts){ const w=cv.clientWidth||400,h=56,ctx=setupCanvas(cv,w,h); ctx.clearRect(0,0,w,h); if(pts.length<2)return;
  const ys=pts.map(p=>p.usd), mn=Math.min(...ys), mx=Math.max(...ys), pad=6;
  const X=i=>pad+i/(pts.length-1)*(w-pad*2), Y=v=> mx===mn?h/2:h-pad-((v-mn)/(mx-mn))*(h-pad*2);
  const up=ys[ys.length-1]>=ys[0], col=up?cvar("--gain"):cvar("--loss");
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(i),Y(p.usd)):ctx.moveTo(X(i),Y(p.usd)));
  const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,col+"33"); g.addColorStop(1,col+"00");
  ctx.lineTo(X(pts.length-1),h); ctx.lineTo(X(0),h); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(i),Y(p.usd)):ctx.moveTo(X(i),Y(p.usd)));
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  const lx=X(pts.length-1),ly=Y(ys[ys.length-1]);
  ctx.beginPath(); ctx.arc(lx,ly,3.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
  ctx.beginPath(); ctx.arc(lx,ly,3.5,0,Math.PI*2); ctx.strokeStyle=cvar("--surface"); ctx.lineWidth=2; ctx.stroke(); }
function snapSeries(){ const s=state.snapshots.slice(); const t=new Date().toISOString().slice(0,10); if(!s.find(x=>x.date===t)) s.push({date:t,usd:netWorthUSD()}); return s; }
function paintCharts(){ const dn=$("#donut"); if(dn){ const t=classUSD(); drawDonut(dn,CLASSES.map(c=>({v:t[c.k],c:cvar(c.v)}))); } const sp=$("#spark"); if(sp) drawSpark(sp,snapSeries()); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }

// ----- render -----
function render(){
  $("#root").innerHTML = topbar() + "<div class=\"wrap\">"
    + (readOnly?"<div class=\"banner\"><span>👁️</span><div>You’re viewing in <b>read-only</b> mode. Only the owner can edit.</div></div>":"")
    + (ui.tab==="overview"?viewOverview(): ui.tab==="holdings"?viewHoldings(): viewCashflow())
    + "</div>" + (ui.modal?modalHTML():"");
  bind(); requestAnimationFrame(paintCharts);
}
function topbar(){
  const tabs=[["overview","Overview"],["holdings","Holdings"],["cashflow","Cash flow"]];
  const live = inArtifact()?"":"<button class=\"livepill "+(liveStatus==="busy"?"busy":liveStatus==="err"?"err":state.liveAt?"on":"")+"\" id=\"liveBtn\" title=\"Refresh live prices now\"><span class=\"d\"></span><span class=\"lt\">"+pillText()+"</span></button>";
  return "<div class=\"topbar\"><div class=\"topbar-in\">"
    +"<div class=\"brand\"><div class=\"brand-mark\">W</div><div><b>Wealth Ledger</b><span>"+esc(new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}))+"</span></div></div>"
    +"<div class=\"tabs\">"+tabs.map(t=>"<button class=\"tab "+(ui.tab===t[0]?"on":"")+"\" data-tab=\""+t[0]+"\">"+t[1]+"</button>").join("")+"</div>"
    +"<div class=\"ccytog\" title=\"Show amounts in\">"+LOCALS.map(c=>"<button data-disp=\""+c+"\" class=\""+(D()===c?"on":"")+"\">"+CCY[c].sym.trim()+"</button>").join("")+"</div>"
    +live
    +"<div id=\"saveStatus\" class=\"status\"><span class=\"led\"></span><span class=\"t\"></span></div>"
    +"<button class=\"icobtn\" id=\"setBtn\" title=\"Settings & live data\">⚙</button>"
    +"<button class=\"icobtn\" id=\"themeBtn\" title=\"Toggle theme\">◐</button>"
    +"</div></div>";
}

function viewOverview(){
  const nwUSD=netWorthUSD(), totals=classUSD();
  const series=snapSeries(), first=series[0].usd, chg=nwUSD-first, chgPct=first?chg/first*100:0, hasHist=state.snapshots.length>0;
  const m=ui.expMonth, incUSD=sumUSD(monthOf(state.income,m)), expUSD=sumUSD(monthOf(state.expenses,m));
  const savedUSD=incUSD-expUSD, sRate= incUSD>0? savedUSD/incUSD*100 : null;
  const chipCls=!hasHist?"flat":chg>0?"gain":chg<0?"loss":"flat";
  const chipTxt=!hasHist?"No history yet":(chg>=0?"↑ ":"↓ ")+fmtD(Math.abs(chg))+" ("+chgPct.toFixed(1)+"%)";
  const banner = inArtifact()
    ? "<div class=\"banner\"><span>⚡</span><div><b>Live prices:</b> this Claude-hosted copy can’t auto-fetch. Tell me <b>“refresh my prices &amp; FX rates”</b> in chat, or host it on your own site (Settings ⚙ → export) for automatic live updates.</div></div>"
    : "<div class=\"banner live\"><span>🟢</span><div><b>Live mode on.</b> Crypto &amp; exchange rates auto-refresh every "+(state.refreshMins||5)+" min"+(state.stockKey?" (stocks too)":"; add a free stock API key in Settings ⚙ for live stock quotes")+". "+(state.liveAt?"Last update "+timeAgo(new Date(state.liveAt).toISOString())+".":"")+"</div></div>";
  return ""
  +"<div class=\"hero\">"
    +"<div class=\"card hero-main\"><div class=\"eyebrow\">Total net worth</div>"
      +"<div class=\"networth num\">"+fmt(nwUSD*rate("TWD"),"TWD")+"</div>"
      +"<div class=\"nw-second num\">"+fmt(nwUSD*rate("IDR"),"IDR")+"</div>"
      +"<div class=\"nw-usd num\">≈ "+fmt(nwUSD,"USD")+" USD</div>"
      +"<div class=\"nw-sub\"><span class=\"chip "+chipCls+"\">"+chipTxt+"</span><span>"+(hasHist?"since first snapshot":"save a snapshot to track growth")+"</span></div>"
      +"<canvas id=\"spark\" class=\"spark\"></canvas>"
    +"</div>"
    +"<div class=\"card hero-side\"><div class=\"eyebrow\" style=\"margin-bottom:14px\">Allocation</div>"
      +"<div style=\"display:flex;gap:18px;align-items:center\"><canvas id=\"donut\" style=\"width:132px;height:132px;flex:none\"></canvas>"
      +"<div style=\"flex:1\">"+CLASSES.map(c=>{ const p=nwUSD?totals[c.k]/nwUSD*100:0;
          return "<div class=\"leg-row\"><span class=\"dot\" style=\"background:var("+c.v+")\"></span>"+c.label+"<span class=\"pct num\">"+p.toFixed(0)+"%</span></div>"; }).join("")+"</div></div>"
    +"</div>"
  +"</div>"
  +"<div class=\"kpis\">"
    +kpi("Investable assets",fmtD(totals.stock+totals.crypto+totals.bond),state.holdings.filter(h=>h.class!=="cash").length+" positions")
    +kpi("Cash & liquid",fmtD(totals.cash),"")
    +kpi("Spent · "+monthLabel(m),fmtD(expUSD),monthOf(state.expenses,m).length+" transactions")
    +kpi("Savings rate · "+monthLabel(m).split(" ")[0], sRate==null?"—":sRate.toFixed(0)+"%", incUSD>0?"saved "+fmtD(savedUSD):"log income to see")
  +"</div>"
  +banner
  +"<div class=\"section-t\"><h2>Net worth over time</h2>"+(readOnly?"":"<button class=\"btn ghost\" id=\"snapBtn\">📍 Save today’s snapshot</button>")+"</div>"
  +"<div class=\"card pad\">"+snapshotList()+"</div>";
}
function kpi(l,v,m){ return "<div class=\"card kpi\"><div class=\"lab\">"+esc(l)+"</div><div class=\"val num\">"+v+"</div>"+(m?"<div class=\"meta\">"+esc(m)+"</div>":"")+"</div>"; }
function snapshotList(){
  if(!state.snapshots.length) return "<div style=\"color:var(--muted);font-size:14px\">No snapshots yet. Save one today, then again next week or month, to build your net-worth trend. (Stored in USD so they stay comparable as rates move.)</div>";
  const s=state.snapshots.slice().reverse();
  return "<div>"+s.map((x,i)=>{ const prev=s[i+1], d=prev?x.usd-prev.usd:0;
    return "<div class=\"txn\"><span class=\"m num\" style=\"width:96px\">"+esc(x.date)+"</span><span class=\"d num\">"+fmtD(x.usd)+"</span>"
      +(prev?"<span class=\"amt num\" style=\"color:"+(d>=0?"var(--gain)":"var(--loss)")+"\">"+(d>=0?"+":"−")+fmtD(Math.abs(d))+"</span>":"<span class=\"amt m\">start</span>")+"</div>"; }).join("")+"</div>";
}

function viewHoldings(){
  const nwUSD=netWorthUSD();
  let html="<div class=\"section-t\"><h2>Holdings</h2><span class=\"hint\">"+(state.pricesUpdatedAt?"Prices "+timeAgo(state.pricesUpdatedAt):"Enter each position in its own currency")+" · shown in "+CCY[D()].sym.trim()+"</span></div>";
  if(!state.holdings.length && !readOnly){
    return html+addHoldingCard()+"<div class=\"card empty\" style=\"margin-top:16px\"><div class=\"big\">📈</div><h3>No holdings yet</h3><div>Add stocks, crypto, bonds and cash — each in NT$, Rp or $ — to see your net worth."+(inArtifact()?"":" Crypto tickers (BTC, ETH…) and USD stocks auto-price live.")+"</div></div>";
  }
  html+="<div class=\"card\"><div class=\"tblwrap\">";
  CLASSES.forEach(c=>{ const rows=state.holdings.filter(h=>h.class===c.k); if(!rows.length)return;
    const subUSD=rows.reduce((a,h)=>a+holdingUSD(h),0);
    html+="<div class=\"class-h\"><span class=\"bar\" style=\"background:var("+c.v+")\"></span>"+c.label+" · "+fmtD(subUSD)+"</div>";
    html+="<table class=\"tbl\"><thead><tr><th>Asset</th>"+(c.unit?"<th class=\"r\">Qty</th>":"")+"<th class=\"r\">"+(c.unit?"Price":"Amount")+"</th><th class=\"r\">Value ("+CCY[D()].sym.trim()+")</th><th class=\"r\">Weight</th>"+(readOnly?"":"<th></th>")+"</tr></thead><tbody>";
    rows.forEach(h=>{ const col=cvar(c.v), init=(h.ticker||h.name||"?").slice(0,3).toUpperCase(), dispUSD=holdingUSD(h);
      const native=h.ccy!==D()? "<div class=\"subval num\">"+fmt(holdingValue(h),h.ccy)+"</div>":"";
      html+="<tr><td><div class=\"asset\"><span class=\"ic\" style=\"background:"+col+"\">"+esc(init)+"</span><span><span class=\"nm\">"+esc(h.name||h.ticker||"—")+"</span><span class=\"ccybadge\">"+h.ccy+"</span>"+(h.live?"<span class=\"livedot\" title=\"auto-priced\"></span>":"")+(h.ticker&&h.name?"<br><span class=\"tk\">"+esc(h.ticker)+"</span>":"")+"</span></div></td>"
        +(c.unit?"<td class=\"r num\">"+(h.qty||0)+"</td>":"")
        +"<td class=\"r\"><input class=\"price-edit num\" data-id=\""+h.id+"\" value=\""+(h.price||0)+"\" "+(readOnly?"disabled":"")+"></td>"
        +"<td class=\"r num\" style=\"font-weight:600\">"+fmtD(dispUSD)+native+"</td>"
        +"<td class=\"r num\" style=\"color:var(--muted)\">"+(nwUSD?(dispUSD/nwUSD*100).toFixed(1):"0.0")+"%</td>"
        +(readOnly?"":"<td class=\"r\"><button class=\"rowbtn del\" data-id=\""+h.id+"\">✕</button></td>")+"</tr>"; });
    html+="</tbody></table>"; });
  html+="</div></div>";
  if(!readOnly) html+="<div class=\"section-t\"><h2>Add a holding</h2></div>"+addHoldingCard();
  return html;
}
function ccySelect(id,sel){ return "<select class=\"inp\" id=\""+id+"\">"+["TWD","IDR","USD"].map(c=>"<option value=\""+c+"\" "+(c===sel?"selected":"")+">"+CCY[c].sym.trim()+" "+c+"</option>").join("")+"</select>"; }
function addHoldingCard(){
  return "<div class=\"card pad\"><form id=\"holdForm\"><div class=\"seg\" id=\"hClass\" style=\"margin-bottom:16px\">"
    +CLASSES.map((c,i)=>"<button type=\"button\" data-c=\""+c.k+"\" class=\""+(i===0?"on":"")+"\">"+c.label+"</button>").join("")
    +"</div><div id=\"hFields\"></div><div style=\"margin-top:16px\"><button class=\"btn gold\" type=\"submit\">+ Add holding</button></div></form></div>";
}
function holdFields(cls){ const c=classOf(cls);
  if(c.unit) return "<div style=\"display:grid;grid-template-columns:1.3fr .8fr .7fr .9fr .9fr;gap:12px;align-items:end\">"
    +field("Name","hName",c.k==="crypto"?"Bitcoin":"Apple Inc.")+field("Ticker","hTicker",c.k==="crypto"?"BTC":"AAPL")
    +fieldNum("Quantity","hQty","10")+fieldNum("Price","hPrice","0.00")
    +"<div class=\"field\"><label>Currency</label>"+ccySelect("hCcy",c.dccy)+"</div></div>";
  return "<div style=\"display:grid;grid-template-columns:1.6fr .9fr .9fr;gap:12px;align-items:end\">"
    +field("Name","hName",cls==="bond"?"Gov’t bond":"Bank savings")+fieldNum("Amount","hPrice","0.00")
    +"<div class=\"field\"><label>Currency</label>"+ccySelect("hCcy",c.dccy)+"</div></div>";
}
function field(l,id,ph){ return "<div class=\"field\"><label>"+l+"</label><input class=\"inp\" id=\""+id+"\" placeholder=\""+esc(ph)+"\"></div>"; }
function fieldNum(l,id,ph){ return "<div class=\"field\"><label>"+l+"</label><input class=\"inp num\" id=\""+id+"\" type=\"number\" step=\"any\" placeholder=\""+esc(ph)+"\"></div>"; }

function viewCashflow(){
  const m=ui.expMonth;
  const exps=monthOf(state.expenses,m).slice(), incs=monthOf(state.income,m).slice();
  const incUSD=sumUSD(incs), expUSD=sumUSD(exps), savedUSD=incUSD-expUSD, sRate=incUSD>0?savedUSD/incUSD*100:null;
  const byCat={}; exps.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+toUSD(e.amount,e.ccy));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]), maxCat=cats.length?cats[0][1]:1;
  const months=monthOptions();
  const feed=incs.map(e=>({...e,kind:"in"})).concat(exps.map(e=>({...e,kind:"out"}))).sort((a,b)=>a.date<b.date?1:-1);
  let html="<div class=\"section-t\"><h2>Cash flow</h2><select class=\"inp\" id=\"monthSel\" style=\"width:auto\">"+months.map(mo=>"<option value=\""+mo+"\" "+(mo===m?"selected":"")+">"+monthLabel(mo)+"</option>").join("")+"</select></div>";
  html+="<div class=\"grid cf-grid\" style=\"grid-template-columns:1fr 1fr;align-items:start\">";
  html+="<div><div class=\"card pad\"><div class=\"eyebrow\">Savings rate · "+esc(monthLabel(m))+"</div>"
    +"<div class=\"networth num\" style=\"font-size:44px;margin:8px 0 2px;color:"+(sRate==null?"var(--ink)":sRate>=0?"var(--gain)":"var(--loss)")+"\">"+(sRate==null?"—":sRate.toFixed(0)+"%")+"</div>"
    +"<div style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">"+(sRate==null?"Log income to calculate":"You saved "+fmtD(savedUSD)+" of "+fmtD(incUSD)+" earned")+"</div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center\">"
      +cfstat("Income",fmtD(incUSD),"var(--gain)")+cfstat("Spending",fmtD(expUSD),"var(--loss)")+cfstat("Net saved",fmtD(savedUSD),savedUSD>=0?"var(--gain)":"var(--loss)")
    +"</div></div>";
  html+="<div class=\"card pad\" style=\"margin-top:16px\"><div class=\"eyebrow\" style=\"margin-bottom:14px\">Spending by category</div>"
    +(cats.length?"<div class=\"catbars\">"+cats.map(c=>{ const meta=CATS.find(x=>x[0]===c[0]);
        return "<div class=\"catbar\"><div class=\"top\"><span>"+(meta?meta[1]+" ":"")+esc(c[0])+"</span><span class=\"num\">"+fmtD(c[1])+"</span></div><div class=\"track\"><div class=\"fill\" style=\"width:"+(c[1]/maxCat*100)+"%;background:var(--gold)\"></div></div></div>"; }).join("")+"</div>":"<div style=\"color:var(--muted);font-size:14px\">No spending logged this month.</div>")
    +"</div></div>";
  html+="<div>";
  if(!readOnly) html+=incomeForm()+expenseForm();
  html+="<div class=\"card pad\" style=\"margin-top:16px\"><div class=\"eyebrow\" style=\"margin-bottom:8px\">Transactions</div>"
    +(feed.length?feed.map(e=>{ const isIn=e.kind==="in", meta=CATS.find(x=>x[0]===e.category);
        return "<div class=\"txn\"><span class=\"cat-ic\">"+(isIn?"💰":(meta?meta[1]:"💳"))+"</span>"
          +"<span><span class=\"d\">"+esc(isIn?e.source:e.category)+(e.note?" · <span class=\"m\" style=\"font-weight:400\">"+esc(e.note)+"</span>":"")+"</span><br><span class=\"m num\">"+esc(e.date)+"</span></span>"
          +"<span class=\"amt num\" style=\"color:"+(isIn?"var(--gain)":"var(--ink)")+"\">"+(isIn?"+":"−")+fmt(e.amount,e.ccy)
            +(e.ccy!==D()?"<span class=\"sub\">"+(isIn?"+":"−")+fmtD(toUSD(e.amount,e.ccy))+"</span>":"")+"</span>"
          +(readOnly?"":"<button class=\"rowbtn "+(isIn?"del-inc":"del-exp")+"\" data-id=\""+e.id+"\" style=\"margin-left:6px\">✕</button>")+"</div>"; }).join("")
      :"<div style=\"color:var(--muted);font-size:14px;padding:8px 0\">Nothing logged this month yet.</div>")+"</div>";
  html+="</div></div>";
  return html;
}
function cfstat(l,v,col){ return "<div><div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700\">"+l+"</div><div class=\"num\" style=\"font-weight:600;font-size:15px;margin-top:4px;color:"+col+"\">"+v+"</div></div>"; }
function incomeForm(){ const today=new Date().toISOString().slice(0,10);
  return "<div class=\"card pad\"><form id=\"incForm\"><div class=\"eyebrow\" style=\"margin-bottom:12px;color:var(--gain)\">＋ Log income</div>"
    +"<div style=\"display:grid;grid-template-columns:1fr .8fr 1fr;gap:10px\">"+fieldNum("Amount","iAmt","0")+"<div class=\"field\"><label>Ccy</label>"+ccySelect("iCcy","TWD")+"</div><div class=\"field\"><label>Date</label><input class=\"inp num\" id=\"iDate\" type=\"date\" value=\""+today+"\"></div></div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:10px\"><div class=\"field\"><label>Source</label><select class=\"inp\" id=\"iSrc\">"+INCOMES.map(s=>"<option>"+s+"</option>").join("")+"</select></div><div class=\"field\"><label>Note</label><input class=\"inp\" id=\"iNote\" placeholder=\"optional\"></div></div>"
    +"<div style=\"margin-top:14px\"><button class=\"btn ghost\" type=\"submit\" style=\"border-color:var(--gain);color:var(--gain)\">Add income</button></div></form></div>";
}
function expenseForm(){ const today=new Date().toISOString().slice(0,10);
  return "<div class=\"card pad\" style=\"margin-top:16px\"><form id=\"expForm\"><div class=\"eyebrow\" style=\"margin-bottom:12px;color:var(--loss)\">－ Log expense</div>"
    +"<div style=\"display:grid;grid-template-columns:1fr .8fr 1fr;gap:10px\">"+fieldNum("Amount","eAmt","0")+"<div class=\"field\"><label>Ccy</label>"+ccySelect("eCcy","TWD")+"</div><div class=\"field\"><label>Date</label><input class=\"inp num\" id=\"eDate\" type=\"date\" value=\""+today+"\"></div></div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:10px\"><div class=\"field\"><label>Category</label><select class=\"inp\" id=\"eCat\">"+CATS.map(c=>"<option value=\""+c[0]+"\">"+c[1]+" "+c[0]+"</option>").join("")+"</select></div><div class=\"field\"><label>Note</label><input class=\"inp\" id=\"eNote\" placeholder=\"e.g. PX Mart\"></div></div>"
    +"<div style=\"margin-top:14px\"><button class=\"btn gold\" type=\"submit\">Add expense</button></div></form></div>";
}

function modalHTML(){
  const r=state.rates, sa=!inArtifact();
  const envNote = sa
    ? "You’re running this <b>self-hosted</b> — live auto-refresh is available below."
    : "You’re running inside <b>Claude</b>, whose sandbox blocks live fetching. Export your data below and host the file on your own site for automatic prices.";
  let live="";
  if(sa){ live="<div class=\"mrow\"><span class=\"mlab\">Auto-refresh live prices</span><label class=\"switch\"><input type=\"checkbox\" id=\"mAuto\" "+(state.autoRefresh?"checked":"")+"><span class=\"slider\"></span></label></div>"
    +"<div class=\"mrow\" style=\"margin-top:12px\"><span class=\"mlab\">Refresh every</span><select class=\"inp\" id=\"mMins\" style=\"width:auto\">"+[2,5,15,30,60].map(n=>"<option value=\""+n+"\" "+(state.refreshMins==n?"selected":"")+">"+n+" min</option>").join("")+"</select></div>"
    +"<div class=\"field\" style=\"margin-top:14px\"><label>Stock API key (optional — for live US stock quotes)</label><input class=\"inp\" id=\"mKey\" value=\""+esc(state.stockKey)+"\" placeholder=\"paste a free Finnhub token\"></div>"
    +"<div style=\"font-size:11.5px;color:var(--faint);margin-top:6px\">Free key at finnhub.io. Crypto &amp; FX need no key. Stored only in this browser.</div>"
    +"<div style=\"margin-top:14px\"><button class=\"btn gold sm\" id=\"mRefresh\">↻ Refresh prices now</button></div><div class=\"mdiv\"></div>"; }
  return "<div class=\"scrim\" id=\"scrim\"><div class=\"modal\"><h3>Settings &amp; live data</h3><div class=\"sub\">"+envNote+"</div>"
    +live
    +"<span class=\"mlab\">Exchange rates"+(state.ratesUpdatedAt?" · updated "+esc(state.ratesUpdatedAt):"")+"</span>"
    +"<div class=\"field\" style=\"margin-top:10px\"><label>TWD per 1 USD</label><input class=\"inp num\" id=\"rTWD\" type=\"number\" step=\"any\" value=\""+r.TWD+"\"></div>"
    +"<div class=\"field\" style=\"margin-top:10px\"><label>IDR per 1 USD</label><input class=\"inp num\" id=\"rIDR\" type=\"number\" step=\"any\" value=\""+r.IDR+"\"></div>"
    +"<div style=\"font-size:12px;color:var(--faint);margin-top:8px\">1 NT$ ≈ Rp "+(r.IDR/r.TWD).toLocaleString("en-US",{maximumFractionDigits:0})+"</div>"
    +(sa?"<div class=\"mdiv\"></div><span class=\"mlab\">Your data</span>"
      +"<div style=\"font-size:11.5px;color:var(--faint);margin:6px 0 10px\">Saved in this browser. Export a backup to keep it safe or move it to another device.</div>"
      +"<div style=\"display:flex;gap:10px\"><button class=\"btn ghost sm\" id=\"mExport\">⬇ Export backup</button><button class=\"btn ghost sm\" id=\"mImport\">⬆ Import</button><input type=\"file\" id=\"mFile\" accept=\"application/json\" style=\"display:none\"></div>":"")
    +"<div class=\"modal-actions\"><button class=\"btn ghost\" id=\"mCancel\">Close</button><button class=\"btn gold\" id=\"mSave\">Save</button></div></div></div>";
}
function exportData(){ try{ const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="wealth-ledger-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }catch(e){ alert("Export failed: "+e.message); } }
function importData(file){ const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result);
  if(!o||!o.holdings&&!o.expenses) throw new Error("not a backup file");
  state=Object.assign(state,o); state=loadStateFrom(state); ui.modal=null; persist(); render(); startLive(); }catch(e){ alert("Import failed: "+e.message); } }; rd.readAsText(file); }
function loadStateFrom(s){ s.holdings=(s.holdings||[]).map(h=>({...h,ccy:h.ccy||"TWD"})); s.expenses=(s.expenses||[]).map(e=>({...e,ccy:e.ccy||"TWD"})); s.income=(s.income||[]).map(e=>({...e,ccy:e.ccy||"TWD"})); s.rates=Object.assign({USD:1,TWD:31.8,IDR:17800},s.rates||{}); s.snapshots=s.snapshots||[]; return s; }

function monthLabel(m){ const [y,mo]=m.split("-"); return new Date(y,mo-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"}); }
function monthOptions(){ const set=new Set(state.expenses.concat(state.income).map(e=>(e.date||"").slice(0,7)).filter(Boolean)); set.add(curMonth()); set.add(ui.expMonth); return Array.from(set).sort().reverse(); }
function timeAgo(iso){ const d=(Date.now()-new Date(iso).getTime())/1000; if(d<90)return"just now"; if(d<3600)return Math.round(d/60)+"m ago"; if(d<86400)return Math.round(d/3600)+"h ago"; return Math.round(d/86400)+"d ago"; }

function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render();});
  document.querySelectorAll("[data-disp]").forEach(b=>b.onclick=()=>setDisplay(b.dataset.disp));
  const tb=$("#themeBtn"); if(tb)tb.onclick=toggleTheme;
  const sb=$("#setBtn"); if(sb)sb.onclick=()=>{ui.modal="set";render();};
  const lb=$("#liveBtn"); if(lb)lb.onclick=()=>refreshLive();
  const snap=$("#snapBtn"); if(snap)snap.onclick=saveSnapshot;
  const mo=$("#monthSel"); if(mo)mo.onchange=()=>{ui.expMonth=mo.value;render();};

  if(ui.modal){ const sc=$("#scrim"); sc.onclick=e=>{if(e.target===sc){ui.modal=null;render();}};
    $("#mCancel").onclick=()=>{ui.modal=null;render();};
    $("#mSave").onclick=()=>{ state.rates.TWD=parseFloat($("#rTWD").value)||state.rates.TWD; state.rates.IDR=parseFloat($("#rIDR").value)||state.rates.IDR;
      const au=$("#mAuto"), mm=$("#mMins"), mk=$("#mKey");
      if(au) state.autoRefresh=au.checked; if(mm) state.refreshMins=parseInt(mm.value)||5; if(mk) state.stockKey=mk.value.trim();
      state.ratesUpdatedAt=new Date().toISOString().slice(0,10); ui.modal=null; persist(); render(); startLive(); };
    const rf=$("#mRefresh"); if(rf)rf.onclick=()=>{ ui.modal=null; render(); refreshLive(); };
    const ex=$("#mExport"); if(ex)ex.onclick=exportData;
    const im=$("#mImport"), mf=$("#mFile"); if(im&&mf){ im.onclick=()=>mf.click(); mf.onchange=()=>{ if(mf.files[0]) importData(mf.files[0]); }; }
  }

  document.querySelectorAll(".price-edit").forEach(inp=>{ const commit=()=>{ const v=parseFloat(inp.value)||0; const h=state.holdings.find(x=>x.id===inp.dataset.id);
      if(h&&h.price!==v){ h.price=v; h.live=false; if(classOf(h.class).unit)state.pricesUpdatedAt=new Date().toISOString(); persist(); render(); } };
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();inp.blur();}}); inp.addEventListener("blur",commit); });
  document.querySelectorAll(".rowbtn.del").forEach(b=>b.onclick=()=>delHolding(b.dataset.id));
  document.querySelectorAll(".del-exp").forEach(b=>b.onclick=()=>delExpense(b.dataset.id));
  document.querySelectorAll(".del-inc").forEach(b=>b.onclick=()=>delIncome(b.dataset.id));

  const hf=$("#holdForm");
  if(hf){ let cls="stock"; const box=$("#hFields"); box.innerHTML=holdFields(cls);
    document.querySelectorAll("#hClass button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("#hClass button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); cls=b.dataset.c; box.innerHTML=holdFields(cls); });
    hf.onsubmit=e=>{ e.preventDefault(); const c=classOf(cls); const name=(($("#hName")||{}).value||"").trim(); const price=parseFloat(($("#hPrice")||{}).value)||0; const ccy=($("#hCcy")||{}).value||"TWD";
      if(c.unit){ const qty=parseFloat(($("#hQty")||{}).value)||0; const tk=(($("#hTicker")||{}).value||"").trim(); if(!name&&!tk){flash($("#hName"));return;} addHolding({class:cls,name:name||tk,ticker:tk.toUpperCase(),qty,price,ccy}); }
      else { if(!name){flash($("#hName"));return;} addHolding({class:cls,name,ticker:"",qty:1,price,ccy}); } };
  }
  const inf=$("#incForm");
  if(inf) inf.onsubmit=e=>{ e.preventDefault(); const a=parseFloat($("#iAmt").value)||0; if(a<=0){flash($("#iAmt"));return;} addIncome({amount:a,ccy:$("#iCcy").value,date:$("#iDate").value||new Date().toISOString().slice(0,10),source:$("#iSrc").value,note:$("#iNote").value.trim()}); };
  const ef=$("#expForm");
  if(ef) ef.onsubmit=e=>{ e.preventDefault(); const a=parseFloat($("#eAmt").value)||0; if(a<=0){flash($("#eAmt"));return;} addExpense({amount:a,ccy:$("#eCcy").value,date:$("#eDate").value||new Date().toISOString().slice(0,10),category:$("#eCat").value,note:$("#eNote").value.trim()}); };
}
function flash(el){ if(!el)return; el.style.borderColor="var(--loss)"; el.focus(); setTimeout(()=>el.style.borderColor="",800); }
function toggleTheme(){ const cur=document.documentElement.getAttribute("data-theme"); const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches); document.documentElement.setAttribute("data-theme",dark?"light":"dark"); requestAnimationFrame(paintCharts); }

try{ const u=JSON.parse(sessionStorage.getItem("wl-ui")); if(u){ ui.tab=u.tab||ui.tab; ui.expMonth=u.expMonth||ui.expMonth; sessionStorage.removeItem("wl-ui"); window.addEventListener("load",()=>setTimeout(()=>window.scrollTo(0,u.scroll||0),60)); } }catch(e){}
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(paintCharts,120);});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>requestAnimationFrame(paintCharts));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !inArtifact() && state.autoRefresh && Date.now()-(state.liveAt||0)>90000) refreshLive(); });

render(); setStatus("saved","Ready");
if(!started){ started=true; startLive(); }
})();
</script>
